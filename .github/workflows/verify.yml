name: Verify 3D viewer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax and controls
        run: node --test tests/source.test.mjs
      - name: Install browser testing
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Render model, exercise controls and capture screenshots
        run: node tests/smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galley-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
