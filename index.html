<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#19232b">
<meta name="description" content="Esplora liberamente in 3D un galeone storico: ruota, avvicinati e osserva scafo, alberi, vele e sartiame.">
<title>Galeone · Visualizzatore 3D</title>
<style>
:root{color-scheme:dark;background:#19232b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
main{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 52% 37%,#3a4447 0%,#242e34 48%,#131d25 100%)}
#viewport{position:absolute;inset:0;touch-action:none;cursor:grab}
#viewport:active{cursor:grabbing}
#viewport canvas{display:block;outline:0}
button{cursor:pointer;font:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #f6ddaa;outline-offset:3px}
#reset{position:absolute;right:max(17px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:2;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid #e9ddc767;background:#17242bbb;color:#f0e5d2;backdrop-filter:blur(8px);opacity:.66;transition:opacity .15s,background .15s}
#reset:hover,#reset:focus-visible{opacity:1;background:#2d3840}
#reset svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
#credit{position:absolute;bottom:max(25px,calc(env(safe-area-inset-bottom) + 8px));left:18px;z-index:2;color:#dfd8c6a8;font-size:10px;line-height:1.4;letter-spacing:.015em;text-decoration:none;opacity:.65;transition:opacity .15s}
#credit:hover,#credit:focus-visible{opacity:1;color:#f3e9d4}
#status{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;color:#eee4d4;z-index:3;pointer-events:none;transition:opacity .3s ease}
#status.dismissed{opacity:0}
.spinner{width:27px;height:27px;border:2px solid #e0d1b241;border-top-color:#e7cf99;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#status-message{font-size:12px;letter-spacing:.055em;text-align:center;max-width:300px;line-height:1.7;padding:0 20px}
#error-link{color:#eecfa0;font-size:12px;pointer-events:auto}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}*{transition:none!important}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
</head>
<body>
<main aria-label="Visualizzatore 3D di un galeone storico">
<div id="viewport" aria-label="Modello 3D interattivo. Trascina per ruotare; usa due dita o la rotellina per ingrandire."></div>
<div id="status" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span><span id="status-message">Caricamento del galeone…</span></div>
<a id="credit" href="https://sketchfab.com/3d-models/nautical-galleon-870b8df2456241269cbc030a101edc50" rel="noopener noreferrer" target="_blank" title="Nautical Galleon di R-LAB · CC BY 4.0">Modello: R-LAB · CC BY 4.0</a>
<button type="button" id="reset" title="Reimposta la visuale (R)" aria-label="Reimposta la visuale"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.4A8.7 8.7 0 1 1 5.3 17"/><path d="M3.4 4.5v6.2h6.2"/></svg></button>
</main>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const viewport=document.querySelector('#viewport');
const status=document.querySelector('#status');
const statusMessage=document.querySelector('#status-message');
let renderer;
try{
 renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
}catch(error){
 status.querySelector('.spinner').remove();
 statusMessage.textContent='Impossibile attivare la grafica 3D su questo dispositivo.';
 throw error;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(viewport.clientWidth,viewport.clientHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.65;
viewport.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,viewport.clientWidth/Math.max(1,viewport.clientHeight),.01,1500);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.075;
controls.enablePan=true;
controls.screenSpacePanning=true;
controls.rotateSpeed=.72;
controls.zoomSpeed=.8;
controls.maxPolarAngle=Math.PI-.02;

scene.add(new THREE.HemisphereLight(0xe9eef1,0x8a7260,3.2));
const key=new THREE.DirectionalLight(0xffedd5,4.2);key.position.set(-20,31,26);scene.add(key);
const fill=new THREE.DirectionalLight(0xc5e5f3,3.1);fill.position.set(27,14,-23);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,2);rim.position.set(4,37,-8);scene.add(rim);

let homePosition=new THREE.Vector3(22,14,24);
let homeTarget=new THREE.Vector3();
let homeDistance=40;
let ship=null;

// Modello completo di terze parti, non la vecchia geometria procedurale.
// Nautical Galleon — R-LAB (rakshaan), Sketchfab, CC BY 4.0.
// Origin asset: https://github.com/urcraft/ship-in-a-bottle/blob/main/public/models/galleon.glb
const modelUrls=[
 'https://urcraft.github.io/ship-in-a-bottle/models/galleon.glb',
 'https://raw.githubusercontent.com/urcraft/ship-in-a-bottle/main/public/models/galleon.glb',
 'https://cdn.jsdelivr.net/gh/urcraft/ship-in-a-bottle@main/public/models/galleon.glb'
];
const loader=new GLTFLoader();
async function loadGalleon(){
 let lastError;
 for(const url of modelUrls){
  try{return (await loader.loadAsync(url)).scene}
  catch(error){lastError=error;console.warn('Impossibile caricare il modello da',url,error)}
 }
 throw lastError||new Error('Nessuna origine disponibile per il modello 3D');
}
function fitCamera(){
 if(!ship)return;
 const box=new THREE.Box3().setFromObject(ship);
 if(box.isEmpty())throw new Error('Modello 3D vuoto');
 const center=box.getCenter(new THREE.Vector3());
 const size=box.getSize(new THREE.Vector3());
 ship.position.sub(center);
 ship.updateMatrixWorld(true);
 const refit=new THREE.Box3().setFromObject(ship);
 const sphere=refit.getBoundingSphere(new THREE.Sphere());
 const maxDimension=Math.max(size.x,size.y,size.z);
 homeTarget.set(0,0,0);
 const aspect=Math.max(.2,viewport.clientWidth/Math.max(1,viewport.clientHeight));
 const verticalFov=THREE.MathUtils.degToRad(camera.fov);
 const effectiveFov=2*Math.atan(Math.tan(verticalFov/2)*Math.min(1,aspect));
 homeDistance=Math.max(maxDimension*.95,sphere.radius/Math.sin(effectiveFov/2)*1.18);
 // Three-quarter view: length axis is detected, so the camera sees both bow and broadside.
 const lengthOnX=size.x>=size.z;
 const direction=new THREE.Vector3(lengthOnX?1.0:.85,.46,lengthOnX?.85:1.0).normalize();
 homePosition=direction.multiplyScalar(homeDistance);
 controls.target.copy(homeTarget);
 camera.position.copy(homePosition);
 controls.minDistance=Math.max(.35,sphere.radius*.20);
 controls.maxDistance=Math.max(homeDistance*5,sphere.radius*7);
 camera.near=Math.max(.01,maxDimension/2000);
 camera.far=Math.max(1000,homeDistance*18);
 camera.updateProjectionMatrix();
 controls.update();
}
function resetCamera(){
 controls.target.copy(homeTarget);
 camera.position.copy(homePosition);
 controls.update();
}
document.querySelector('#reset').addEventListener('click',resetCamera);
window.addEventListener('keydown',event=>{
 if(event.key.toLowerCase()==='r'&&!event.altKey&&!event.ctrlKey&&!event.metaKey)resetCamera();
});
function resize(){
 const width=viewport.clientWidth,height=Math.max(1,viewport.clientHeight);
 camera.aspect=width/height;
 camera.updateProjectionMatrix();
 renderer.setSize(width,height);
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
 if(ship)fitCamera();
}
window.addEventListener('resize',resize);
const observer=new ResizeObserver(()=>{
 if(viewport.clientWidth&&viewport.clientHeight)resize();
});
observer.observe(viewport);

function render(){
 requestAnimationFrame(render);
 controls.update();
 renderer.render(scene,camera);
}
render();

try{
 ship=await loadGalleon();
 // A presentation podium included in the model export is not part of the ship.
 const artifacts=[];
 ship.traverse(child=>{if(/podium|pedestal|stand[_ -]?base/i.test(child.name))artifacts.push(child)});
 artifacts.forEach(child=>child.removeFromParent());
 ship.traverse(child=>{
  if(!child.isMesh)return;
  child.frustumCulled=true;
  for(const material of (Array.isArray(child.material)?child.material:[child.material])){
   if(material?.isMeshStandardMaterial||material?.isMeshPhysicalMaterial){
    material.side=THREE.DoubleSide;
    material.needsUpdate=true;
   }
  }
 });
 scene.add(ship);
 fitCamera();
 status.classList.add('dismissed');
 setTimeout(()=>status.remove(),360);
}catch(error){
 console.error('Caricamento del galeone fallito',error);
 status.querySelector('.spinner')?.remove();
 statusMessage.textContent='Non sono riuscito a caricare il modello 3D. Riprova tra poco.';
 const retry=document.createElement('a');
 retry.id='error-link';
 retry.href=location.href;
 retry.textContent='Ricarica la pagina';
 status.append(retry);
}
</script>
</body>
</html>
